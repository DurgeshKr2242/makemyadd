name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sunday at 06:00 UTC (11:30 IST). Weekly is enough for a low-traffic repo.
    - cron: "0 6 * * 0"

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Skip generated/vendored noise
          config: |
            paths-ignore:
              - "client/node_modules"
              - "client/.next"
              - "client/playwright-report"
              - "client/test-results"

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
