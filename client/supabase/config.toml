# Supabase project config.
# Run `supabase init` after installing the CLI to materialise the rest of
# the supabase/ folder. This file is enough for the CLI to recognise the
# project root for `supabase db push`.
#
# project_id is set per-environment via `supabase link --project-ref <ref>`
# — do NOT hard-code your prod ref here.

project_id = "adcreator"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
# We use Cloudflare R2 instead of Supabase Storage. Disabled to avoid
# accidental object creation.
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false   # MVP: skip confirmation. Re-enable in Phase 2 (see TODO §3.1).

[auth.external.google]
# Disabled until we wire OAuth in §3 — having `enabled = true` without a
# client_id makes `supabase link` refuse to load this config.
#
# When you're ready to turn this on:
#   1. Set GOOGLE_OAUTH_CLIENT_ID + GOOGLE_OAUTH_SECRET in your shell or
#      ~/.config/claude/.env (NEVER commit them).
#   2. Flip `enabled = true` and uncomment the env() lines below.
#   3. Run `pnpm supabase link` again to push the config.
enabled = false
# client_id     = "env(GOOGLE_OAUTH_CLIENT_ID)"
# secret        = "env(GOOGLE_OAUTH_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"
